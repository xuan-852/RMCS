rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::DartNewLauncher -> hardware
      - rmcs_core::controller::dart::ManualDispatcher -> manual_dispatcher
      - rmcs_core::controller::dart::CarriageNewController -> carriage_new_controller
      - rmcs_core::controller::dart::BeltNewController -> belt_new_controller
      - rmcs_core::controller::pid::PidController -> carriage_motor_velocity_pid
      - rmcs_core::controller::pid::PidController -> belt_left_velocity_pid
      - rmcs_core::controller::pid::PidController -> belt_right_velocity_pid
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster
      - rmcs_dart_guidance::v2::DartAgent -> dart_agent
      - rmcs_dart_guidance::v2::DartAgentRemoteBridge -> dart_agent_remote_bridge

hardware:
  ros__parameters:
    board_serial: ""

    # 微动开关：固定在 Board Lite 的 UART1_RX 上
    micro_switch_pull_up: true
    micro_switch_active_low: true
    micro_switch_read_period_ms: 10

    # 弹舱电机：M3508 / CAN0 / ID1 / 19:1 输出轴速度
    carriage_motor_id: 1
    carriage_motor_reduction_ratio: 19.0
    carriage_motor_reversed: false

    # 同步带左右电机：M3508 / CAN0 / 19:1
    # ID 待机械装完实测（注意别和 carriage 撞号）
    belt_left_motor_id: 3
    belt_right_motor_id: 2
    belt_motor_reduction_ratio: 19.0
    # 镜像安装，一侧必须翻转坐标系，让两侧 /angle /velocity /torque 同向
    belt_left_motor_reversed: false
    belt_right_motor_reversed: true

# ─────────────────────────────────────────────────────────────────────────────
# CarriageNewController
#
# 纯执行器：把目标速度转发给弹舱电机，把标零请求转发给硬件层。
# 归零流程（撞开关 → 退离 → 标零）由上位机 dart-init 任务推进。
# 手动档位由控制器内的 kManual 说明书声明，经 ManualDispatcher 分发。
# ─────────────────────────────────────────────────────────────────────────────
carriage_new_controller:
  ros__parameters:
    # ── 调试模式 ──
    # true = 手动档位改用 carriage-dbg 说明书（日志便于区分）
    debug_mode: false
    debug_torque_limit: 0.0        # 保留参数位（carriage 无独立力矩限幅）

    # ── 手动 ──
    sensitivity_forward: 10.0      # 摇杆推到底 → rad/s（输出轴）
    sensitivity_reverse: 10.0      # 摇杆拉到底 → rad/s（输出轴）
    deadzone: 0.05                 # 摇杆回中死区，避免电机蠕动


carriage_motor_velocity_pid:
  ros__parameters:
    measurement: /dart/carriage_motor/velocity
    setpoint: /dart/carriage_motor/control_velocity
    control: /dart/carriage_motor/control_torque
    kp: 0.3
    ki: 0.0
    kd: 0.0
    integral_min: -500.0
    integral_max: 500.0
    output_min: -3.0
    output_max: 3.0

# ─────────────────────────────────────────────────────────────────────────────
# BeltNewController
#
# 纯执行器：把目标速度转发给左右电机，把标零请求转发给硬件层。
# 归零流程（上推堵转 → 标零）由上位机 dart-init 任务推进。
#
# 唯一保留的判断是左右同步：两侧不共轴，位置差以 sync_gain 折算成速度修正。
#
# ⚠️ 同步依赖「两侧编码器都为 0」，异步时位置差是随机值，
#    拿它做同步会输出错误修正量，把滑台拽歪。所以必须先跑过 dart-init 再手动。
# ─────────────────────────────────────────────────────────────────────────────
belt_new_controller:
  ros__parameters:
    # ── 调试模式 ──
    # false = 正常：左右同速 + 同步闭环
    # true  = 调试：不同步，左摇杆 Y/X 分别单独驱动左/右电机
    debug_mode: false
    debug_torque_limit: 2.0        # 调试模式的力矩上限，比正常小，防拽坏

    # ── 手动 ──
    sensitivity_forward: -10.0     # 摇杆推到底 → rad/s
    sensitivity_reverse: -10.0     # 摇杆拉到底 → rad/s
    deadzone: 0.05
    manual_torque_limit: 6.0

    # ── 左右同步 ──
    # sync_gain = 0 时关闭同步（两侧同速），方便先验证机械
    sync_gain: 0.0                 # (rad/s) / rad
    sync_correction_max: 5.0       # 单次修正上限
    sync_err_limit: 2.0            # 同步误差告警阈值（rad）
    sync_err_fault_ticks: 1000     # 超限持续多少 tick 判故障停车

belt_left_velocity_pid:
  ros__parameters:
    measurement: /dart/belt/left_motor/velocity
    setpoint: /dart/belt/left_motor/control_velocity
    control: /dart/belt/left_motor/control_torque
    output_abs_limit: /dart/belt/left_motor/control_torque_limit
    kp: 1.0
    ki: 0.0
    kd: 0.0

belt_right_velocity_pid:
  ros__parameters:
    measurement: /dart/belt/right_motor/velocity
    setpoint: /dart/belt/right_motor/control_velocity
    control: /dart/belt/right_motor/control_torque
    output_abs_limit: /dart/belt/right_motor/control_torque_limit
    kp: 1.0
    ki: 0.0
    kd: 0.0


value_broadcaster:
  ros__parameters:
    forward_list:
      - /dart/micro_switch/observed
      - /dart/remote/switch_left
      - /dart/remote/switch_right
      - /dart/remote/valid
      - /dart/carriage_motor/applied_torque
      - /dart/carriage_motor/velocity
      - /dart/carriage_motor/control_velocity
      - /dart/carriage_motor/angle
      - /dart/carriage_motor/torque

# ─────────────────────────────────────────────────────────────────────────────
# DartAgent（新镖架上位机任务代理）
#
# 归零、堵转判断、到位判断全部在这里配。下位机 controller 只转发目标。
# 任务表：rmcs_dart_automation/src/manager/tasks/task_registry.hpp
# 任务逻辑：rmcs_dart_automation/src/manager/tasks/dart_tasks.hpp
#
# 命令由 DartAgentRemoteBridge 从 DR16 拨杆翻译而来（照抄老镖架语义）：
#   左 DOWN → MIDDLE         → dart-init           归零
#   左 MID  + 右 MID→DOWN    → dart-launch-prepare 准备 ⇄ 取消（toggle）
#   左 MID  + 右 MID→UP      → dart-fire           发射
#   左 UP   + 右 MID         → 手动档，桥静默
#   左右双下                 → 静默，硬件层全电机 NaN 急停
#                              （DartAgent 同时清空任务队列）
# ─────────────────────────────────────────────────────────────────────────────
dart_agent:
  ros__parameters:
    # ── 飞镖 ──
    dart_count: 4                    # 上场实际装几发（1~8）
    dart_0_carriage_staypoint: 0.0   # 每发的弹舱停位（绝对角度）
    dart_1_carriage_staypoint: 0.0
    dart_2_carriage_staypoint: 0.0
    dart_3_carriage_staypoint: 0.0
    dart_4_carriage_staypoint: 0.0
    dart_5_carriage_staypoint: 0.0
    dart_6_carriage_staypoint: 0.0
    dart_7_carriage_staypoint: 0.0

    # ── 同步带 ──
    belt_trigger_distance: 0.0       # 顶部 → 扳机位相对位移（实测填入）
    belt_home_velocity: 5.0          # 归零上推速度
    belt_down_velocity: 5.0          # 带载下降速度
    belt_up_velocity: 8.0            # 上升速度
    homing_torque_limit: 3.0         # 归零力矩上限（要够大才顶得住）
    belt_load_torque_limit: 6.0      # 带载力矩上限
    belt_unload_torque_limit: 2.0    # 空载力矩上限

    # ── 弹舱 ──
    carriage_home_velocity: 5.0      # 归零向上撞开关
    carriage_back_off_velocity: 2.0  # 开关触发后退离
    carriage_back_off_distance: 0.1  # 退离距离（退离后即零位）
    carriage_goto_velocity: 20.0     # 定位速度上限
    carriage_goto_gain: 10.0         # P 增益
    carriage_goto_tolerance: 0.02    # 到位置容差
