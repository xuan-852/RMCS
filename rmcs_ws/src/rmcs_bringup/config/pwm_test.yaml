# ═════════════════════════════════════════════════════════════════════════════
# GPIO / PWM 测试专用配置
#
# 用途：单独验证 Board Lite 的 GPIO 引脚能不能被软件控制。
# ⚠️ 与 dart_new_launcher.yaml 互斥 —— 两者都独占同一块板子，不能同时运行。
#
# 启动：
#   set-robot pwm_test
#   launch-rmcs
#
# ─── 测试顺序（由浅入深，前一步不通过就别往下走）─────────────────────────────
#
#  第 1 步  mode: hold_low    引脚恒定低电平，万用表应为 0V
#  第 2 步  mode: hold_high   引脚恒定高电平，万用表应为 3.3V
#
#     这两步是硬指标。只有确认能切到低、也能切到高，才说明
#     gpio_digital_write 这条链路真的通到了引脚，此时才谈得上「软件 PWM」。
#     若低/高读出来都是 3.3V，说明引脚被 UART 复用占死或固件不处理
#     digital write —— 那软件 PWM 也就不可能成立，得换硬件方案。
#
#  第 3 步  mode: digital_pulse  软件翻电平出方波，示波器看有无波形
#  第 4 步  mode: analog         复核固件是否解析 analog value
#  第 5 步  mode: sweep          低频爬 duty，万用表看是否变化
#  第 6 步  mode: off            不写任何值，观察引脚默认状态
#
# ─── channel 可选值 ─────────────────────────────────────────────────────────
#   0 = UART0_RX    1 = UART0_TX    2 = UART1_RX（默认）    3 = UART1_TX
#
#   注：UART0_RX (ch0) 现在接的是微动开关，测别的引脚前先确认没插着开关，
#       否则会把开关那根线拉低/拉高。
#
# ─── 实测结论（2026-11-11，全部通过）─────────────────────────────────────────
#
#   ch2 (UART1_RX) 四档扫过，占空比 0%~100% 线性可控：
#
#     hold_low      0%    理论 0.00V   实测 0.0V   ✅
#     high/low=1/3  25%   理论 0.82V   实测 0.83V  ✅
#     high/low=1/1  50%   理论 1.65V   实测 1.68V  ✅
#     hold_high     100%  理论 3.30V   实测 3.3V   ✅
#
#   → gpio_digital_write 完整通到引脚，软件 PWM 成立。
#   → 之前「duty=0 与 65535 输出相同」的问题出在固件不解析 analog value，
#     不是引脚本身的问题。数字写入这条路是通的。
#
# ─── 但精度受 update_rate 硬限制 ─────────────────────────────────────────────
#
#   update_rate = 1kHz，每 tick = 1ms，脉宽只能是 1ms 的整数倍。
#   舵机要 1000~2000us，在这个粒度下只有两个可表达点：
#
#     1 tick = 1000us  → 一端极限
#     2 tick = 2000us  → 另一端极限
#
#   结论：
#     ✗ 做不了比例控制（1500us 中位无法表达）
#     ✓ 但能当"二位置开关舵机"用 —— 扳机只需要"扣下/松开"两态，够用
#
#   若要更多档位，需提高 update_rate：
#     2kHz → 500us 粒度 → 3 个位置
#     4kHz → 250us 粒度 → 5 个位置
#    10kHz → 100us 粒度 → 11 个位置
#   提高前要先评估对整机控制周期的影响。
#
# ─── 判定标准 ───────────────────────────────────────────────────────────────
#
#   hold_low  读到 0.0V  且  hold_high 读到 3.3V
#     → 引脚完全可控，软件 PWM 可行，继续测 digital_pulse
#
#   hold_low  读到 0.0V  但  hold_high 仍是 0.0V
#     → 只能拉低不能拉高，开漏/复用限制，软件 PWM 不成立
#
#   两档都读到 3.3V
#     → digital write 根本没通到引脚，换硬件方案
# ═════════════════════════════════════════════════════════════════════════════
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::PwmTester -> pwm_tester

pwm_tester:
  ros__parameters:
    # 当前测试档位：hold_low / hold_high / digital_pulse / analog / sweep / off
    #
    # 实测记录（2026-11-11）：
    #   hold_low  时 ch2(R) = 0.0V   ← 能拉低 ✅
    #   hold_high 时 ch2(R) = 3.3V   ← 能拉高 ✅
    #   → gpio_digital_write 完整通到引脚，软件翻转可行
    #   （ch3(T) 未被写入时为 3.3V，是默认上拉态，不作为证据）
    mode: digital_pulse

    # 要测哪个引脚：0=UART0_RX 1=UART0_TX 2=UART1_RX 3=UART1_TX
    channel: 2

    # digital_pulse 模式：软件翻电平，周期 = high + low
    # ⚠️ update_rate=1kHz 时每 tick = 1ms，脉宽只能取 1ms 整数倍。
    #    1500us 会被取整成 2 tick 或 1 tick，与真实舵机时序差太多。
    #    所以这里直接用 tick 粒度能表达的值：
    #
    #    high=1000us(1 tick) + low=3000us(3 tick) → 250Hz, 占空比 25%
    #    万用表应读约 0.83V
    #
    #    对照记录（2026-11-11）：
    #      high=1000 low=1000 (50%) → 实测 1.68V，理论 1.65V ✅
    #      下面改成 25% 再看电压是否跟着掉到 0.83V
    high_us: 1000.0
    low_us: 3000.0

    # sweep 模式：每步增加多少
    sweep_step_us: 100.0
