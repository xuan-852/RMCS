# ═════════════════════════════════════════════════════════════════════════════
# Board Pro 端口综合测试配置（PWM 舵机 + 空闲数字 IO 联动测试）
#
# 用途：
#   在硬件资料/丝印对应关系不全时，一次性摸清 Board Pro 的：
#     1) PWM 口（channel 0~3 = kPwm0~kPwm3）能否正常发硬件 50Hz 舵机信号；
#     2) 空闲 IO 口（channel 4~10 = kSpiI2cSocket0~6）各自对应的物理座子与好坏。
#
#   ⚠️ 严格不碰任何 UART 引脚（channel 11~16 禁止读写）。
#   ⚠️ 与 dart_new_launcher.yaml 互斥 —— 两者都独占同一块 Board Pro，不能同时运行。
#
# 启动：
#   set-robot pwm_test
#   launch-rmcs
#
# 运行时微调舵机脉宽（无需重启）：
#   ros2 param set /pwm_tester pulse_us 1500
#   ros2 param set /pwm_tester pulse_us 1250
# ═════════════════════════════════════════════════════════════════════════════
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::PwmTester -> pwm_tester

pwm_tester:
  ros__parameters:
    board_serial: ""

    # ── 先测硬件 PWM 舵机 ──
    # 可选 mode：
    #   hw_servo       : 硬件 PWM 发 pulse_us（仅 0~3，默认先测这个）
    #   hw_servo_sweep : 硬件 PWM 在 sweep_min_us ~ sweep_max_us 往返扫行程
    #   hold_low       : 输出恒定 0V（0~10 任意口）
    #   hold_high      : 输出恒定 3.3V（0~10 任意口）
    #   digital_pulse  : 软件翻转方波
    #   analog         : 直接按 high_us/(high_us+low_us) 写占空比（0~3）
    #   off            : 不输出，仅监听输入 IO
    mode: hw_servo

    # 输出目标通道（仅允许 0~10；hw_servo / hw_servo_sweep / analog 仅允许 0~3）：
    #   0=Pwm0  1=Pwm1  2=Pwm2  3=Pwm3
    #   4=SpiI2cSocket0 .. 10=SpiI2cSocket6
    channel: 3

    freq_hz: 50.0             # 舵机 50Hz (20ms 周期)
    pulse_us: 2050.0          # 初始中位脉宽（支持 ros2 param set /pwm_tester pulse_us 动态修改）//1900
    sweep_min_us: 500.0
    sweep_max_us: 2500.0
    sweep_step_us: 250.0
    sweep_hold_s: 3.0

    # ── 空闲数字 IO 实时监测（默认全开 4~10，微动开关插上按下即在终端报跳变）──
    # 如需测 Pwm 口做输入，也可加进这里；若某号与上面的输出 channel 相同会自动跳过
    # input_pull: down(下拉 0V，默认) | up(上拉 3.3V) | none(浮空)
    input_channels: [ 5 ]
    input_pull: up
    input_period_ms: 20

    # 备用（digital_pulse / analog 用）
    high_us: 1000.0
    low_us: 3000.0
